<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AV Messages</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --paper:#FFFFFF;--ink:#0A0A0A;--mute:#8C8C8C;--line:rgba(10,10,10,.14);--red:#FF2D20;
  --font:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --ease:cubic-bezier(.76,0,.24,1);--out:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme:dark){:root{--paper:#0A0A0A;--ink:#F4F4F2;--mute:#7C7C7C;--line:rgba(244,244,242,.16)}}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{height:100%}
body{font-family:var(--font);background:var(--paper);color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;line-height:1.25;font-variant-numeric:tabular-nums}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}

/* ---------- Splash: один выход, без украшений ---------- */
.splash{position:fixed;inset:0;z-index:1000;background:#0A0A0A;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:28px 24px calc(28px + env(safe-area-inset-bottom));pointer-events:none;animation:curtain .85s var(--ease) 2.3s forwards}
@keyframes curtain{to{transform:translateY(-100%)}}
.logo{display:flex;align-items:flex-end;font-size:min(48vw,240px);font-weight:900;letter-spacing:-.07em;line-height:.78}
.mask{display:block;overflow:hidden;padding:.06em .02em .1em 0}
.mask span{display:block;transform:translateY(110%);animation:up .9s var(--out) forwards}
.mask:nth-child(1) span{animation-delay:.25s}.mask:nth-child(2) span{animation-delay:.42s}
@keyframes up{to{transform:none}}
.dot{width:.17em;height:.17em;margin:0 0 .1em .04em;background:var(--red);transform:scale(0);animation:pop .35s var(--out) 1s forwards}
@keyframes pop{to{transform:scale(1)}}
.bar{height:8px;margin-top:22px;background:var(--red);transform:scaleX(0);transform-origin:left;animation:bar 1s var(--ease) .95s forwards}
@keyframes bar{to{transform:scaleX(1)}}
.tag{margin-top:16px;font-size:16px;font-weight:600;opacity:0;animation:fade .6s ease 1.5s forwards}
@keyframes fade{to{opacity:1}}

/* ---------- Полноэкранные состояния ---------- */
.screen{position:fixed;inset:0;display:none;flex-direction:column;justify-content:flex-end;padding:calc(env(safe-area-inset-top) + 56px) 24px calc(28px + env(safe-area-inset-bottom));overflow:hidden}
.screen.visible{display:flex;animation:screenIn .7s var(--out)}
@keyframes screenIn{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0)}}
.giant{font-size:min(36vw,190px);font-weight:900;letter-spacing:-.07em;line-height:.82;margin-bottom:26px}
.lead{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.15;max-width:360px;margin-bottom:34px}
.block{display:block;width:100%;height:68px;border:0;padding:0 22px;text-align:left;font-size:21px;font-weight:800;letter-spacing:-.02em;background:var(--ink);color:var(--paper);transition:transform .2s var(--out)}
.block:active{transform:scale(.98)}
.link{margin-top:20px;font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px;cursor:pointer}

#tosWarning{background:var(--paper);color:var(--ink);z-index:1001}
#tosWarning .lead a{color:inherit;text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:3px;text-underline-offset:4px}
#tosWarning .small{font-size:16px;font-weight:500;color:var(--mute);margin-bottom:30px;max-width:320px;line-height:1.4}

#bannedScreen{background:var(--red);color:#0A0A0A;z-index:2000}
#bannedScreen .block{background:#0A0A0A;color:#fff}
#bannedScreen .giant{animation:slam .6s var(--out) .15s both}
@keyframes slam{from{transform:translateY(40px) scale(1.15);opacity:0}}
.ban-time{font-size:56px;font-weight:900;letter-spacing:-.05em;line-height:1;margin-bottom:8px}
.ban-msg{font-size:19px;font-weight:600;margin-bottom:34px}

#nightScreen{background:#0A0A0A;color:#fff;z-index:3000}
#nightScreen .giant{font-size:min(24vw,130px);animation:slam .6s var(--out) .15s both}
#nightScreen .block{background:#fff;color:#0A0A0A}
.live{display:inline-block;width:.16em;height:.16em;margin-left:.06em;background:var(--red);animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.night-message{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin-bottom:34px;max-width:360px;color:#cfcfcf}

/* ---------- Приложение ---------- */
.app{position:relative;height:100%;display:none;flex-direction:column;max-width:480px;margin:0 auto;width:100%}
.app.visible{display:flex}
.top{padding:calc(env(safe-area-inset-top) + 48px) 20px 0;display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:17px;letter-spacing:-.02em;animation:fadeDown .7s var(--out) both}
.top b{font-weight:900;letter-spacing:-.06em;font-size:20px}
.top b i{display:inline-block;width:.32em;height:.32em;background:var(--red);margin-left:2px}
.top span{color:var(--mute);font-weight:600}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}}

.nav-tabs{position:relative;display:flex;gap:22px;padding:22px 20px 0;border-bottom:1px solid var(--line);margin-bottom:0;animation:fadeDown .7s var(--out) .08s both}
.nav-tab{position:relative;background:none;border:0;padding:0 0 16px;font-size:30px;font-weight:900;letter-spacing:-.05em;color:var(--ink);opacity:.22;transition:opacity .3s}
.nav-tab.active{opacity:1}
.nav-tab sup{font-size:15px;letter-spacing:0}
#unansweredBadge{color:var(--red);font-size:16px;font-weight:900;margin-left:4px;vertical-align:top;position:relative;top:-2px}
.mark{position:absolute;left:0;bottom:-1px;height:5px;background:var(--red);width:0;transition:transform .55s var(--ease),width .55s var(--ease)}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.tab{display:none}.tab.active{display:block}
.messages-list{display:flex;flex-direction:column}

.row{position:relative;padding:22px 20px 24px;animation:reveal .75s var(--out) both;animation-delay:calc(var(--i,0)*80ms + 60ms)}
@keyframes reveal{from{clip-path:inset(0 0 100% 0);transform:translateY(18px)}to{clip-path:inset(0);transform:none}}
.row::after{content:'';position:absolute;left:20px;right:20px;bottom:0;height:1px;background:var(--line);transform-origin:left;animation:rule .9s var(--ease) both;animation-delay:calc(var(--i,0)*80ms + 200ms)}
@keyframes rule{from{transform:scaleX(0)}}
.row:active{background:var(--line)}
.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px}
.no{font-size:46px;font-weight:900;letter-spacing:-.06em;line-height:.9}
.no small{display:block;font-size:13px;font-weight:600;letter-spacing:0;color:var(--mute);margin-bottom:6px}
.time{font-size:13px;font-weight:600;color:var(--mute);padding-bottom:4px}
.state{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin:10px 0 12px}
.state i{width:11px;height:11px;background:var(--red)}
.waiting .state i{animation:blink 1.1s steps(1) infinite}
.done .state i{background:var(--ink)}
.txt{font-size:20px;font-weight:600;letter-spacing:-.025em;line-height:1.25;word-break:break-word;white-space:pre-wrap}
.answer{background:var(--ink);color:var(--paper);padding:16px 16px 14px;margin:12px 0 16px}
.answer-header{font-size:12px;font-weight:700;opacity:.55;margin-bottom:8px}
.answer-text{font-size:21px;font-weight:700;letter-spacing:-.03em;line-height:1.2;white-space:pre-wrap;word-break:break-word}
.answer-meta{margin-top:12px;font-size:13px;font-weight:600;opacity:.55}
.orig b{display:block;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:4px}
.orig span{font-size:16px;font-weight:500;color:var(--mute);white-space:pre-wrap;word-break:break-word}

.loading{position:relative;padding:34px 20px;font-size:15px;font-weight:700;color:var(--mute);overflow:hidden}
.loading::before{content:'';position:absolute;top:0;left:0;height:4px;width:30%;background:var(--red);animation:slide 1s var(--ease) infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
.loading-spinner{display:none}
.empty-state{padding:42px 20px;animation:reveal .8s var(--out) both}
.empty-icon{display:none}
.empty-state h3{font-size:min(26vw,128px);font-weight:900;letter-spacing:-.07em;line-height:.85;margin-bottom:18px}
.empty-state p{font-size:19px;font-weight:600;letter-spacing:-.02em;max-width:280px;color:var(--mute)}

/* ---------- Ввод ---------- */
.message-input-container{border-top:5px solid var(--ink);background:var(--paper);padding:10px 20px calc(14px + env(safe-area-inset-bottom));animation:fadeUp .8s var(--out) .15s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}}
.message-input-wrapper{position:relative;margin-bottom:12px}
.message-input{width:100%;padding:6px 0 18px;border:0;background:transparent;color:var(--ink);font:700 24px/1.15 var(--font);letter-spacing:-.035em;resize:none;outline:none;user-select:text;-webkit-user-select:text;display:block}
.message-input::placeholder{color:var(--mute);opacity:.6}
.char-counter{position:absolute;right:0;bottom:0;font-size:12px;font-weight:700;color:var(--mute)}
.char-bar{position:absolute;left:0;bottom:3px;height:3px;width:100%;background:var(--line)}
.char-bar i{display:block;height:100%;width:0;background:var(--red);transition:width .3s var(--out)}
.send-btn{position:relative;overflow:hidden;display:block;width:100%;height:68px;border:0;padding:0 22px;text-align:left;font-size:22px;font-weight:900;letter-spacing:-.03em;background:var(--line);color:var(--mute);cursor:not-allowed;transition:background .35s var(--ease),color .35s;isolation:isolate}
.send-btn.active{background:var(--ink);color:var(--paper);cursor:pointer}
.send-btn.active:active{transform:scale(.985)}
.send-btn::before{content:'';position:absolute;inset:0;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease);z-index:-1}
.send-btn.sending::before,.send-btn.sent::before{transform:scaleX(1)}
.send-btn.sent{color:#fff}
.lbl{display:block;height:68px;overflow:hidden}
.lbl span{display:flex;align-items:center;justify-content:space-between;height:68px;transition:transform .55s var(--ease)}
.send-btn.sent .lbl span{transform:translateY(-100%)}
.arrow{width:26px;height:26px;background:currentColor;clip-path:polygon(0 40%,62% 40%,62% 15%,100% 50%,62% 85%,62% 60%,0 60%)}
.ripple{display:none}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- Splash -->
<div class="splash" id="splash">
  <div class="logo"><span class="mask"><span>A</span></span><span class="mask"><span>V</span></span><i class="dot"></i></div>
  <div class="bar"></div>
  <div class="tag">Сообщения администратору</div>
</div>

<!-- Banned -->
<div class="screen" id="bannedScreen">
  <div class="giant">БАН</div>
  <div class="ban-time" id="banTime">1 день</div>
  <div class="ban-msg">Аккаунт заблокирован.</div>
  <button class="block" id="closeBannedBtn">Закрыть</button>
  <a class="link" id="rulesLink">Правила пользования</a>
</div>

<!-- Night -->
<div class="screen" id="nightScreen">
  <div class="giant">Закрыто<span class="live"></span></div>
  <div class="night-message" id="nightMessage">Работа приостановлена администратором</div>
  <button class="block" id="closeNightBtn">Закрыть</button>
</div>

<!-- TOS -->
<div class="screen" id="tosWarning">
  <div class="giant">Сначала условия</div>
  <div class="small">Примите их в боте, и приложение откроется.</div>
  <div class="lead">
    <a href="https://telegra.ph/Privacy-Policy-for-AV-Messages-Bot-02-26" target="_blank">Конфиденциальность</a><br>
    <a href="https://telegra.ph/Terms-of-Service-for-message-to-av-Bot-02-26" target="_blank">Правила</a>
  </div>
  <button class="block" id="closeAppBtn">Закрыть</button>
</div>

<!-- App -->
<div class="app" id="app">
  <div class="top"><b>AV<i></i></b><span id="userName">User</span></div>

  <nav class="nav-tabs">
    <button class="nav-tab active" data-tab="inbox">Входящие<sup id="unansweredBadge" class="hidden">0</sup></button>
    <button class="nav-tab" data-tab="sent">Отправленные</button>
    <div class="mark" id="mark"></div>
  </nav>

  <main class="content">
    <div class="tab active" id="inbox-tab"><div class="messages-list" id="inboxMessages"><div class="loading">Грузим<div class="loading-spinner"></div></div></div></div>
    <div class="tab" id="sent-tab"><div class="messages-list" id="sentMessages"><div class="loading">Грузим<div class="loading-spinner"></div></div></div></div>
  </main>

  <div class="message-input-container" id="messageInputContainer">
    <div class="message-input-wrapper">
      <textarea class="message-input" id="messageText" placeholder="Пишите." rows="2" maxlength="4096"></textarea>
      <div class="char-bar"><i id="charBar"></i></div>
      <span class="char-counter" id="charCounter">0/4096</span>
    </div>
    <button class="send-btn" id="sendMessageBtn" disabled>
      <span class="lbl"><span>Отправить<i class="arrow"></i></span><span id="sentLbl">Отправлено<i class="arrow"></i></span></span>
    </button>
  </div>
</div>

<script>
(function(){
  let animationFinished=false, authFinished=false, authResult=null, bannedInfo=null;
  const tg=window.Telegram.WebApp;
  const $=id=>document.getElementById(id);
  const splash=$('splash'), tosWarning=$('tosWarning'), app=$('app'), bannedScreen=$('bannedScreen'), nightScreen=$('nightScreen');
  const haptic=(t='light')=>{try{tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(t)}catch(e){}};
  const notify=(t='success')=>{try{tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred(t)}catch(e){}};

  try{tg.expand();}catch(e){}
  try{tg.requestFullscreen();}catch(e){}
  try{const dark=matchMedia('(prefers-color-scheme:dark)').matches,c=dark?'#0A0A0A':'#FFFFFF';tg.setHeaderColor(c);tg.setBackgroundColor(c);}catch(e){}

  [tosWarning,bannedScreen,nightScreen].forEach(e=>e.classList.remove('visible'));
  app.classList.remove('visible');

  function getDaysText(d){if(d===1)return'1 день';if(d>=2&&d<=4)return d+' дня';return d+' дней';}
  function hideAll(){splash.style.display='none';[tosWarning,bannedScreen,nightScreen].forEach(e=>e.classList.remove('visible'));app.classList.remove('visible');}

  function showBannedScreen(info){
    bannedInfo=info;let t='Навсегда';
    if(info.until){const diff=new Date(info.until)-new Date();if(diff>0){const d=Math.floor(diff/864e5);t=d>=1?getDaysText(d):Math.max(1,Math.ceil(diff/36e5))+' ч.';}}
    $('banTime').textContent=t;hideAll();bannedScreen.classList.add('visible');notify('error');
  }
  function showNightScreen(m){$('nightMessage').textContent=m||'Работа приостановлена администратором';hideAll();nightScreen.classList.add('visible');}

  function startAnimation(){
    splash.addEventListener('animationend',e=>{if(e.animationName==='curtain'){animationFinished=true;tryShowScreen();}});
    setTimeout(()=>{if(!animationFinished){animationFinished=true;tryShowScreen();}},4200);
  }

  async function runAuth(){
    try{authResult=await authenticate(tg.initData);}
    catch(e){authResult={ok:false,error:e.message};}
    finally{authFinished=true;tryShowScreen();}
  }

  function tryShowScreen(){
    if(!animationFinished||!authFinished)return;
    if(authResult&&!authResult.ok&&authResult.error==='night_mode'){showNightScreen(authResult.message);return;}
    if(authResult&&!authResult.ok&&authResult.error==='banned'&&authResult.ban_info){showBannedScreen(authResult.ban_info);return;}
    splash.style.display='none';
    if(authResult&&authResult.ok&&authResult.user&&authResult.user.accepted_tos===true){
      window.userData=authResult.user;window.tg=tg;
      $('userName').textContent=authResult.user.first_name||'User';
      if(authResult.user.unanswered>0){$('unansweredBadge').textContent=authResult.user.unanswered;$('unansweredBadge').classList.remove('hidden');}
      app.classList.add('visible');
      setupTabs();setupEventListeners();
      Promise.all([loadInboxMessages(tg.initData).catch(()=>[]),loadSentMessages(tg.initData).catch(()=>[])]);
    }else{tosWarning.classList.add('visible');}
  }

  async function authenticate(initData){
    if(!initData)return{ok:false,error:'Нет данных авторизации'};
    try{
      const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({initData})});
      if(r.status===503){const e=await r.json();return{ok:false,...e};}
      if(!r.ok){const e=await r.json().catch(()=>({}));return{ok:false,...e,status:r.status};}
      return await r.json();
    }catch(e){return{ok:false,error:e.message};}
  }

  async function loadList(url,show,initData){
    try{
      const r=await fetch(url,{headers:{'X-Telegram-Init-Data':initData}});
      if(r.status===503){const e=await r.json();if(e.error==='night_mode'){showNightScreen(e.message);return;}}
      if(r.status===403){const e=await r.json();if(e.error==='banned'&&e.ban_info){showBannedScreen(e.ban_info);return;}}
      if(!r.ok){show([]);return;}
      const d=await r.json();show(d.messages||[]);
    }catch(e){show([]);}
  }
  const loadInboxMessages=d=>loadList('/api/messages/inbox',displayInboxMessages,d);
  const loadSentMessages=d=>loadList('/api/messages/sent',displaySentMessages,d);

  async function sendMessage(){
    const ta=$('messageText'),btn=$('sendMessageBtn'),text=ta.value.trim();
    if(!text||btn.disabled)return;
    btn.disabled=true;btn.classList.remove('active');btn.classList.add('sending');haptic('heavy');
    let ok=false;
    try{
      const r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({initData:window.tg.initData,text})});
      if(r.status===503){const e=await r.json();if(e.error==='night_mode'){showNightScreen(e.message);return;}}
      const res=await r.json();
      if(!r.ok){
        if(res.error==='banned'&&res.ban_info){showBannedScreen(res.ban_info);return;}
        notify('error');alert(res.message||'Ошибка');return;
      }
      if(res.ok){
        ok=true;notify('success');
        $('sentLbl').firstChild.textContent='Отправлено №'+res.message_id;
        btn.classList.add('sent');
        ta.value='';$('charCounter').textContent='0/4096';$('charBar').style.width='0';
        await Promise.all([loadInboxMessages(window.tg.initData),loadSentMessages(window.tg.initData)]);
        if(window.tg.showPopup)window.tg.showPopup({title:'Отправлено',message:`Сообщение #${res.message_id}`,buttons:[{type:'ok'}]});
      }else if(res.message){notify('warning');alert(res.message);}
    }catch(e){notify('error');alert('Ошибка отправки');}
    finally{
      const reset=()=>{btn.classList.remove('sending','sent');const has=ta.value.trim().length>0;btn.disabled=!has;btn.classList.toggle('active',has);};
      if(ok)setTimeout(reset,1700);else reset();
    }
  }

  const fmt=d=>d.toLocaleString('ru-RU',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});
  function empty(c,h,p){c.innerHTML=`<div class="empty-state"><h3>${h}</h3><p>${p}</p></div>`;}

  function displayInboxMessages(m){
    const c=$('inboxMessages');if(!c)return;
    if(!m||!m.length){empty(c,'Тишина.','Админ пока молчит. Как ответит, увидите здесь.');return;}
    c.innerHTML=m.map((x,i)=>`
      <article class="row reply" style="--i:${i}">
        <div class="head"><div class="no"><small>Ответ на</small>№${x.message_id}</div><span class="time">${fmt(x.answered_at?new Date(x.answered_at):new Date())}</span></div>
        <div class="answer">
          <div class="answer-header">Администратор</div>
          <div class="answer-text">${escapeHtml(x.answer_text||'Ответ получен')}</div>
          <div class="answer-meta">${escapeHtml(x.answered_by_name||'Администратор')}</div>
        </div>
        <div class="orig"><b>Вы писали</b><span>${escapeHtml(x.original_text||'')}</span></div>
      </article>`).join('');
  }

  function displaySentMessages(m){
    const c=$('sentMessages');if(!c)return;
    if(!m||!m.length){empty(c,'Пусто.','Напишите первое сообщение внизу. Его прочитают.');return;}
    c.innerHTML=m.map((x,i)=>`
      <article class="row ${x.is_answered?'done':'waiting'}" style="--i:${i}">
        <div class="head"><div class="no">№${x.message_id}</div><span class="time">${fmt(x.forwarded_at?new Date(x.forwarded_at):new Date())}</span></div>
        <div class="state"><i></i>${x.is_answered?'Отвечено':'Ждёт ответа'}</div>
        <div class="txt">${escapeHtml(x.text||'')}</div>
      </article>`).join('');
  }

  function setupTabs(){
    const btns=[...document.querySelectorAll('.nav-tab')],tabs=document.querySelectorAll('.tab'),mark=$('mark');
    const place=b=>{mark.style.width=b.offsetWidth+'px';mark.style.transform=`translateX(${b.offsetLeft}px)`;};
    place(btns[0]);
    btns.forEach(b=>b.addEventListener('click',function(){
      if(this.classList.contains('active'))return;haptic('light');
      btns.forEach(x=>x.classList.remove('active'));this.classList.add('active');place(this);
      tabs.forEach(t=>t.classList.remove('active'));
      const t=$(this.dataset.tab+'-tab');t.classList.add('active');
      t.querySelectorAll('.row').forEach(r=>{r.style.animation='none';r.offsetWidth;r.style.animation='';});
    }));
  }

  function setupEventListeners(){
    const ta=$('messageText'),btn=$('sendMessageBtn');
    ta.addEventListener('input',()=>{
      const l=ta.value.length;$('charCounter').textContent=l+'/4096';$('charBar').style.width=(l/4096*100)+'%';
      const has=ta.value.trim().length>0;btn.disabled=!has;btn.classList.toggle('active',has);
    });
    btn.addEventListener('click',sendMessage);
  }

  function escapeHtml(u){
    if(!u)return'';
    return u.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
  }

  const close=()=>{try{tg.close();}catch(e){window.close();}};
  $('closeBannedBtn').addEventListener('click',close);
  $('closeNightBtn').addEventListener('click',close);
  $('closeAppBtn').addEventListener('click',close);
  $('rulesLink').addEventListener('click',e=>{
    e.preventDefault();const u='https://telegra.ph/Terms-of-Service-for-message-to-av-Bot-02-26';
    if(tg.openLink)tg.openLink(u);else window.open(u,'_blank');
  });

  startAnimation();runAuth();
})();
</script>
</body>
</html>
